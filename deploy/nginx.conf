server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    location = /healthz { default_type text/plain; return 200 'infra-web-ok\n'; }
    location = /infra/ { alias /usr/share/nginx/html/index.html; }
    location /actuator/ { return 404; }
    location /prometheus/ {
        auth_basic 'MOSSDOOM Test Infrastructure';
        auth_basic_user_file /etc/nginx/monitor.htpasswd;
        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
    location / {
        resolver 127.0.0.11 valid=10s;
        set $application app:8080;
        proxy_pass http://$application;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 45s;
    }
}
